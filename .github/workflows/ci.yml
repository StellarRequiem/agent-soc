name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install -U pip
          pip install pytest
      - name: Detector + response proof (offline, temp paths only)
        run: pytest tests/ -q
      - name: CLI claim + detect smoke
        run: |
          python cli.py claim
          python cli.py detect
